# Fretzpod: static files. The app talks to Jellyfin directly from the browser
# (see DESIGN.md, "How it fits together"). The exceptions are /speakers/
# (DESIGN.md, "Speakers"), passed to the fretzpod-speakers service, and
# /scores/api/ (DESIGN.md, "High scores"), passed to fretzpod-scores.
#
# This is a template: build.py fills the __PLACEHOLDERS__ from site/site.json
# and app/tv-hosts.json, and swaps the optional helper sections for a plain
# 404 when that helper isn't configured.

# Which Jellyfin each address of the app may talk to: the same table the app
# uses to pick one (config.js, api.js), so each copy is allowed exactly the
# one it uses.
map $http_host $fp_jellyfin {
__JELLYFIN_MAP__
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # No access log: visitors' IP addresses, browsers and requests aren't
    # recorded (privacy: gather nothing about listeners that isn't
    # needed). Errors only at "crit", and missing files don't log, since those
    # lines would carry the client address too.
    access_log off;
    log_not_found off;
    error_log /var/log/nginx/error.log crit;

    # Content Security Policy: scripts, styles and fonts only from this pod (no
    # CDNs, no inline code); API calls and album art only to that copy's
    # Jellyfin; audio from the page's own Media Source stream (blob:), or from
    # that Jellyfin directly in basic mode (player.js).
    # TV: the free channels play straight from their own servers, and only the
    # ones in app/tv-hosts.json: build.py fills __TV_HOSTS__ from that list
    # (build.py; it was any https address once). Scripts still only
    # come from this pod, which is what keeps injected code out.
    # worker-src (2026-10-25): hls.js unpacks TV video in a Web Worker it
    # starts from a blob: URL; without this it does that on the main thread,
    # the one the wheel runs on (measured: 50 ms stalls on a laptop every few
    # seconds, so a few hundred ms on a phone). Making a blob: worker takes
    # script already running in the page, so it adds nothing for an
    # attacker. 'self' keeps sw.js (the offline copy) allowed: without
    # worker-src it was allowed through script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' $fp_jellyfin __TV_HOSTS__; worker-src 'self' blob:; img-src 'self' data: $fp_jellyfin; media-src blob: $fp_jellyfin __TV_HOSTS__; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    # Song and art requests carry ids; never send the page address anywhere.
    add_header Referrer-Policy no-referrer always;
    # Always revalidate so a deploy shows up on the next open (the service
    # worker, on the https copy, falls back to its cache when offline).
    # Note: any add_header inside a location block would drop all of these,
    # so keep headers at this level.
    add_header Cache-Control "no-cache" always;

    # hls.js (for TV) lives in its own folder (on Kubernetes its own
    # ConfigMap: with it the app files would crowd ConfigMap's 1 MiB limit).
    # Compressed on the way out (620 KB -> ~190).
    location /vendor/ {
        alias /usr/share/nginx/vendor/;
        gzip on;
        gzip_types application/javascript;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx's type list doesn't know .webmanifest. An empty types {} makes
    # default_type apply here (no add_header, so the headers above still apply).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The helpers are looked up when a request comes in (resolver +
    # variable) rather than at startup, so Fretzpod still starts if one is
    # ever missing. The resolver is the DNS that knows their names (the
    # cluster DNS on Kubernetes, 127.0.0.11 under Docker).
    resolver __RESOLVER__ valid=30s;
    # Keep-alive to the helpers (HTTP/1.1, no "Connection: close"), for
    # every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # BEGIN speakers
    set $fp_speakers __SPEAKERS_URL__;

    location /speakers/audio/ {
        proxy_pass $fp_speakers;
        # Songs stream straight through instead of filling nginx's buffers
        # (and its /tmp, which is small and read-only elsewhere).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The control API answers on every copy (the installed app is usually
    # the https one). fretzpod-speakers only lets in the Jellyfin accounts
    # on its allow list, checked against Jellyfin on every new sign-in.
    location /speakers/api/ {
        proxy_pass $fp_speakers;
        proxy_read_timeout 60s;
    }
    # END speakers

    # BEGIN scores
    # High score boards, on every copy. fretzpod-scores asks Jellyfin who
    # the phone's sign-in belongs to; no sign-in, no board.
    set $fp_scores __SCORES_URL__;
    location /scores/api/ {
        proxy_pass $fp_scores;
        proxy_read_timeout 20s;
    }
    # END scores
}
